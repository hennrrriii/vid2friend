name: release

# Triggered by pushing a version tag:
#   npm version patch      (bumps package.json and creates the tag)
#   git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

      # The real Supabase project is baked in here, so the released zip has the
      # narrow host permission the Chrome Web Store review expects. Add these two
      # under Settings > Secrets and variables > Actions > Variables.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Pack
        run: cd dist && zip -r ../vid2friend-${{ github.ref_name }}.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: vid2friend-${{ github.ref_name }}.zip
          generate_release_notes: true

