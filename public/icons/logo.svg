<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="vid2friend">
  <defs>
    <linearGradient id="v2f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72a3f2"/>
      <stop offset="1" stop-color="#2467d4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#v2f-bg)"/>
  <!-- Rear triangle: the video being handed over. -->
  <g opacity="0.5">
    <path d="M32 44 L32 84 L56 64 Z" fill="#ffffff" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  </g>
  <!-- Front triangle: the video arriving. -->
  <path d="M66 38 L66 90 L100 64 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
</svg>
